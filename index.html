<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visain Timer</title>
<style>
:root{--p1:#1b0b3d;--p2:#3a1a78;--p3:#5b2bb0;--gold:#f0b429;--gold2:#ffd76a;--white:#fff;--warn:#ffb020;--red:#ff4d4f;--ok:#7ee0a1}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--white);
 background:radial-gradient(ellipse at 50% 20%,var(--p3) 0%,var(--p2) 38%,var(--p1) 100%);overflow:hidden;transition:background .6s}
body.warn{background:radial-gradient(ellipse at 50% 20%,#7a4a00 0%,#3d2a66 40%,var(--p1) 100%)}
body.red,body.over{background:radial-gradient(ellipse at 50% 20%,#8a1620 0%,#3a1458 45%,var(--p1) 100%)}
.stage{position:relative;z-index:1}.dock{z-index:5}.drawer{z-index:6}#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wave{position:fixed;z-index:0;inset:auto -10% -12% -10%;height:34vh;pointer-events:none;opacity:.55}
.stage{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5vh 4vw 140px;text-align:center}
body.display .stage{padding-bottom:3vh}
.logo{position:relative;height:clamp(64px,15vh,170px);display:flex;align-items:center;padding:0 clamp(16px,3vw,40px);z-index:1}
.logo::before{content:"";position:absolute;inset:-10px -4px;background:#fff;border-radius:60px;filter:blur(13px);opacity:.93;z-index:-1}
.logo img{height:100%;width:auto;display:block;position:relative}
.name{margin-top:2vh;font-size:clamp(18px,3.6vh,44px);font-weight:600;color:var(--gold2);letter-spacing:.04em;min-height:1.3em;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.label{margin-top:1vh;font-size:clamp(13px,2.4vh,26px);text-transform:uppercase;letter-spacing:.32em;color:#d9c9ff;font-weight:600}
.time{font-variant-numeric:tabular-nums;font-weight:700;line-height:1;font-size:min(27vw,41vh);letter-spacing:.01em;margin:.5vh 0;
 text-shadow:0 0 40px rgba(240,180,41,.35),0 6px 24px rgba(0,0,0,.45);transition:color .3s}
.time.long{font-size:min(19vw,37vh)}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 14px rgba(255,200,70,.35))}50%{filter:drop-shadow(0 0 46px rgba(255,215,106,.95))}}
.time{animation:glow 3.2s ease-in-out infinite}body.warn .time{animation-duration:1.8s}body.red .time{animation-duration:.9s}
body.warn .time{color:var(--warn)} body.red .time{color:var(--red)} body.over .time{color:var(--red);animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
.msg{font-size:clamp(18px,4vh,48px);font-weight:600;min-height:1.3em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.bar{width:min(80vw,1100px);height:clamp(8px,1.5vh,16px);background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-top:2vh}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .2s linear}
body.warn .bar i{background:var(--warn)} body.red .bar i,body.over .bar i{background:var(--red)}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 18px 16px;background:linear-gradient(180deg,rgba(20,8,48,0) 0%,rgba(20,8,48,.92) 35%);display:flex;flex-direction:column;gap:10px;align-items:center;transition:opacity .4s}
body.display .dock,body.display .drawer{display:none}
body.idle .dock{opacity:0;pointer-events:none} body.idle{cursor:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
button,select,input{font:inherit}
.btn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px;transition:.15s}
.btn:hover{background:rgba(255,255,255,.2)} .btn:active{transform:scale(.97)}
.btn.main{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1650;border:none;font-size:18px;padding:12px 34px;box-shadow:0 6px 20px rgba(240,180,41,.35)}
.btn.main.run{background:linear-gradient(180deg,#fff,#e5dcff)}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:#d9c9ff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px}
.seg button.on{background:var(--gold);color:#2a1650}
.tin{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.1);border-radius:12px;padding:4px 10px;font-weight:700}
.tin input{width:3.2ch;background:none;border:0;color:#fff;text-align:center;font-size:22px;font-weight:700;outline:none;-moz-appearance:textfield}
.tin input::-webkit-outer-spin-button,.tin input::-webkit-inner-spin-button{-webkit-appearance:none}
.tin small{font-size:11px;color:#cbb8f5;margin-right:6px;text-transform:uppercase;letter-spacing:.1em}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid rgba(255,255,255,.25);background:none;color:#e9ddff;border-radius:99px;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600}
.chip:hover{background:rgba(255,255,255,.15)}
.drawer{position:fixed;right:16px;bottom:150px;width:min(360px,92vw);background:rgba(25,10,60,.96);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:16px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.drawer.open{display:block}
.drawer h3{margin:0 0 10px;font-size:15px;color:var(--gold2);text-transform:uppercase;letter-spacing:.12em}
.drawer label{display:block;font-size:13px;color:#cbb8f5;margin:10px 0 4px}
.drawer input[type=text],.drawer input[type=number]{width:100%;padding:9px 11px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:15px}
.drawer .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drawer .chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:#fff;font-size:14px}
.hint{z-index:2;position:fixed;top:10px;right:14px;font-size:12px;color:#bda9ee;opacity:.8}
body.display .hint,body.idle .hint{display:none}

.tabs{position:fixed;top:12px;left:14px;z-index:7;display:inline-flex;background:rgba(20,8,48,.7);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:3px;backdrop-filter:blur(6px);transition:opacity .4s}
.tabs button{border:0;background:none;color:#d9c9ff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:700;font-size:14px}
.tabs button.on{background:var(--gold);color:#2a1650}
body.display .tabs,body.display .wheelview{display:none!important}
body.idle .tabs{opacity:0}
.wheelview{display:none;position:fixed;inset:0;z-index:2;padding:62px 3vw 18px;gap:3vw;align-items:center;justify-content:center}
body.view-wheel .wheelview{display:flex}
body.view-wheel .stage,body.view-wheel .dock,body.view-wheel .hint,body.view-wheel .drawer{display:none}
.wcol{display:flex;flex-direction:column;align-items:center;gap:14px}
#wheel{width:min(76vh,46vw);height:min(76vh,46vw);display:block;filter:drop-shadow(0 12px 40px rgba(0,0,0,.55))}
.qcol{width:min(46vw,640px);display:flex;flex-direction:column;gap:14px}
.wtitle{font-size:clamp(20px,3.4vh,34px);font-weight:800;color:var(--gold2);letter-spacing:.06em;text-transform:uppercase}
.score{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:6px 14px;font-weight:700;font-size:15px}
.pill.g{color:var(--ok)}.pill.r{color:#ff8a8c}
.qcard{background:rgba(25,10,60,.82);border:1.5px solid rgba(240,180,41,.55);border-radius:20px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.45);min-height:300px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(6px)}
.qcat{align-self:flex-start;padding:5px 14px;border-radius:99px;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.qtext{font-size:clamp(22px,3.5vh,40px);font-weight:700;line-height:1.25}
.qans{display:none;background:linear-gradient(180deg,rgba(255,215,106,.22),rgba(240,180,41,.12));border:1.5px solid var(--gold);border-radius:14px;padding:14px 16px;font-size:clamp(20px,3.2vh,34px);font-weight:700;color:var(--gold2)}
.qans small{display:block;font-size:12px;letter-spacing:.2em;color:#e9ddff;margin-bottom:4px;text-transform:uppercase}
.qres{display:none;font-size:clamp(22px,3.6vh,38px);font-weight:800}
.qbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.btn.ok{background:#1f9d55;border-color:#1f9d55}.btn.ok:hover{background:#25b866}
.btn.bad{background:#c0392b;border-color:#c0392b}.btn.bad:hover{background:#d84a3b}
.btn[disabled]{opacity:.4;pointer-events:none}
.qcard.shake{animation:shake .6s}
@keyframes shake{10%,90%{transform:translateX(-4px)}20%,80%{transform:translateX(8px)}30%,50%,70%{transform:translateX(-12px)}40%,60%{transform:translateX(12px)}}
body.failflash::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(255,40,40,0) 40%,rgba(255,40,40,.45));pointer-events:none;z-index:9;animation:ff .9s forwards}
@keyframes ff{to{opacity:0}}
@media(max-width:900px){.wheelview{flex-direction:column;overflow:auto;align-items:center;justify-content:flex-start}#wheel{width:min(88vw,60vh);height:min(88vw,60vh)}.qcol{width:92vw}}
</style>
</head>
<body>
<svg class="wave" viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0,120 C250,20 450,200 700,110 S1050,40 1200,100" fill="none" stroke="#f0b429" stroke-width="3"/><path d="M0,140 C250,40 450,220 700,130 S1050,60 1200,120" fill="none" stroke="#f0b429" stroke-width="1.5" opacity=".6"/></svg>
<canvas id="fx"></canvas>
<nav class="tabs" id="tabs"><button id="tTimer" class="on">⏱ Temporizador</button><button id="tWheel">🎡 Ruleta</button></nav>
<section class="wheelview" id="wheelView">
  <div class="wcol"><canvas id="wheel"></canvas><button class="btn main" id="bSpin">🎡 GIRAR LA RULETA</button></div>
  <div class="qcol">
    <div class="wtitle">Ruleta Visain</div>
    <div class="score"><span class="pill g" id="sOk">✔ 0</span><span class="pill r" id="sBad">✘ 0</span><span class="pill" id="sLeft">50 preguntas</span><button class="btn" id="bResetScore" style="padding:6px 12px;font-size:13px">↺ Reiniciar</button></div>
    <div class="qcard" id="qcard"></div>
  </div>
</section>

<section class="drawer" id="drawer">
  <h3>Ajustes</h3>

  <div class="two"><div><label for="inWarn">Aviso amarillo (min restantes)</label><input type="number" id="inWarn" min="0" step="0.5"></div>
  <div><label for="inRed">Aviso rojo (min restantes)</label><input type="number" id="inRed" min="0" step="0.5"></div></div>

  </div>
</footer>

<script>
(function(){
const $=s=>document.querySelector(s);
const isDisplay=location.hash==='#display';
if(isDisplay)document.body.classList.add('display');
let S={mode:'down',total:600,base:0,running:false,startAt:0,name:'',msg:'',warn:2,red:1,sound:true,auto:true,fx:true};
try{const sv=JSON.parse(localStorage.getItem('visainTimer')||'{}');for(const k of['mode','total','name','msg','warn','red','sound','auto','fx'])if(k in sv)S[k]=sv[k];}catch(e){}
let win=null,lastPhase='',wake=null,view='timer';
const save=()=>{try{localStorage.setItem('visainTimer',JSON.stringify(S))}catch(e){}};
const elapsed=()=>S.base+(S.running?Date.now()-S.startAt:0);
const pad=n=>String(n).padStart(2,'0');
const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h>0?h+':'+pad(m)+':'+pad(x):pad(m)+':'+pad(x)};
function calc(){
  const e=elapsed();let text,phase='ok',pct=0,label;
  if(S.mode==='down'){
    const rem=S.total*1000-e;
    if(rem>0){const r=Math.ceil(rem/1000);text=fmt(r);label='Tiempo restante';
      if(r<=S.red*60)phase='red';else if(r<=S.warn*60)phase='warn';}
    else{text='+'+fmt(Math.floor(-rem/1000));phase='over';label='Tiempo cumplido';}
    pct=S.total?Math.min(1,e/(S.total*1000)):0;
  }else{
    text=fmt(Math.floor(e/1000));label='Tiempo transcurrido';
    if(S.total>0){const r=Math.ceil((S.total*1000-e)/1000);
      if(r<=0){phase='over';label='Límite superado';}else if(r<=S.red*60)phase='red';else if(r<=S.warn*60)phase='warn';
      pct=Math.min(1,e/(S.total*1000));}
  }
  return{text,phase,pct,label};
}
function render(){
  const c=calc();
  $('#time').textContent=c.text;$('#time').classList.toggle('long',c.text.length>5);
  $('#label').textContent=c.label;$('#bar').style.width=(c.pct*100)+'%';
  $('#name').textContent=S.name||'';$('#msg').textContent=S.msg||'';
  document.body.classList.remove('warn','red','over');if(c.phase!=='ok')document.body.classList.add(c.phase);
  setFx(c.phase);
  document.title=(S.running?c.text+' · ':'')+'Visain Timer';
  if(!isDisplay){
    $('#bStart').textContent=S.running?'⏸ Pausar':(elapsed()>0?'▶ Reanudar':'▶ Iniciar');
    $('#bStart').classList.toggle('run',S.running);
    $('#mDown').classList.toggle('on',S.mode==='down');$('#mUp').classList.toggle('on',S.mode==='up');
    $('#tinLbl').textContent=S.mode==='down'?'Tiempo':'Límite';
    if(document.activeElement!==$('#inMin')&&document.activeElement!==$('#inSec')){$('#inMin').value=Math.floor(S.total/60);$('#inSec').value=pad(S.total%60);}
    if(c.phase!==lastPhase&&S.running&&S.sound){ if(c.phase==='warn')beep([660],.25);else if(c.phase==='red')beep([660,660],.2);else if(c.phase==='over')beep([880,880,880],.45); }
    lastPhase=c.phase;
  }
}

/* ===== chispas doradas ===== */
const cv=$('#fx'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;
function rs(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
rs();addEventListener('resize',rs);
const COL={ok:[255,205,80],warn:[255,176,32],red:[255,168,70],over:[255,140,60]};
const sprites={};
function sprite(k){if(sprites[k])return sprites[k];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),[r,gg,b]=COL[k],gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,235,1)');gr.addColorStop(.18,`rgba(${r},${gg},${b},.95)`);gr.addColorStop(.55,`rgba(${r},${gg},${b},.25)`);gr.addColorStop(1,`rgba(${r},${gg},${b},0)`);g.fillStyle=gr;g.fillRect(0,0,64,64);return sprites[k]=c;}
const CFG={ok:{rate:16,glint:.9,speed:1,burst:0},warn:{rate:34,glint:2.4,speed:1.5,burst:0},red:{rate:64,glint:5.5,speed:2.1,burst:1},over:{rate:90,glint:9,speed:2.6,burst:1}};

  $('#inMin').onchange=$('#inSec').onchange=setTime;
  $('#inMin').onkeydown=$('#inSec').onkeydown=e=>{if(e.key==='Enter'){setTime();e.target.blur()}};
  [1,3,5,10,15,20,30,45,60].forEach(m=>{const b=document.createElement('button');b.className='chip';b.textContent=m+' min';b.onclick=()=>{S.total=m*60;S.running=false;S.base=0;change();};$('#chips').appendChild(b);});
  const bind=(id,key,type)=>{const el=$(id);if(type==='chk')el.checked=!!S[key];else el.value=S[key];el.oninput=()=>{S[key]=type==='chk'?el.checked:type==='num'?Math.max(0,parseFloat(el.value)||0):el.value;change();};};
  bind('#inName','name');bind('#inMsg','msg');bind('#inWarn','warn','num');bind('#inRed','red','num');bind('#inSound','sound','chk');bind('#inFx','fx','chk');bind('#inAuto','auto','chk');
  /* idle hide */
  let idle;const wake2=()=>{document.body.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>{if(S.running&&S.auto&&document.fullscreenElement&&!$('#drawer').classList.contains('open'))document.body.classList.add('idle')},3000)};
  ['mousemove','mousedown','keydown'].forEach(ev=>document.addEventListener(ev,wake2));wake2();
  document.addEventListener('keydown',e=>{
    if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&e.key!=='Escape')return;
    if(window.__wheelKey&&window.__wheelKey(e))return;
    if(view==='wheel')return;
    if(e.code==='Space'){e.preventDefault();toggle();}
    else if(e.key==='r'||e.key==='R')reset();
    else if(e.key==='f'||e.key==='F')toggleFull();
    else if(e.key==='p'||e.key==='P')openProj();
    else if(e.key==='ArrowUp'){e.preventDefault();addMin(1);}
    else if(e.key==='ArrowDown'){e.preventDefault();addMin(-1);}
    else if(e.key==='m'||e.key==='M')setMode(S.mode==='down'?'up':'down');
  });
  render();
}
function toggleFull(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}}
})();
</script>
</body>
